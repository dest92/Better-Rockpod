name: Release

on:
  push:
    tags:
      - 'better-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ipod6g, ipodvideo]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo flex bison zip \
            automake libtool libtool-bin autoconf \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev
      - name: Cache ARM cross-toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/rbdev
          key: rbdev-arm-elf-eabi-${{ hashFiles('tools/rockboxdev.sh') }}
      - name: Build ARM cross-toolchain (cache miss only)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/rbdev"
          RBDEV_PREFIX="$HOME/rbdev" RBDEV_TARGET=a ./tools/rockboxdev.sh
      - name: Configure and build ${{ matrix.target }}
        run: |
          export PATH="$HOME/rbdev/bin:$PATH"
          mkdir build-hw && cd build-hw
          ../tools/configure --target=${{ matrix.target }} --type=n
          make -j"$(nproc)"
          make zip
          mv rockbox.zip "../better-rockpod-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.target }}
          path: better-rockpod-*.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum better-rockpod-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Better-Rockpod ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            better-rockpod-*.zip
            SHA256SUMS
