name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests (ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make -C tests

  simulator:
    name: Simulator build (ipod6g)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
      - name: Configure and build
        run: |
          mkdir build-sim && cd build-sim
          ../tools/configure --target=ipod6g --type=s
          make -j"$(nproc)"

  hardware:
    name: Hardware build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ipod6g, ipodvideo]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo flex bison zip \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev
      - name: Cache ARM cross-toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/rbdev
          key: rbdev-arm-elf-eabi-${{ hashFiles('tools/rockboxdev.sh') }}
      - name: Build ARM cross-toolchain (first run only, ~30 min)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/rbdev"
          RBDEV_PREFIX="$HOME/rbdev" RBDEV_TARGET=a ./tools/rockboxdev.sh
      - name: Configure and build ${{ matrix.target }}
        run: |
          export PATH="$HOME/rbdev/bin:$HOME/rbdev/arm-elf-eabi/bin:$PATH"
          mkdir build-hw && cd build-hw
          ../tools/configure --target=${{ matrix.target }} --type=n
          make -j"$(nproc)"
          make zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-${{ matrix.target }}
          path: build-hw/rockbox.zip
